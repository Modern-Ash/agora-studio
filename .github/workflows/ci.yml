name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-install:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out Studio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Core 0.8 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Modern-Ash/agora
          ref: v0.8.0
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Studio, Core, and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e core -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Enforce Application Services boundary
        run: python scripts/check_boundaries.py

      - name: Test unit, frontend, HTTP, and real Core integration
        run: python -m unittest discover -s tests -v

      - name: Build Studio distributions
        run: python -m build core && python -m build

      - name: Install and smoke-test Studio wheel
        run: |
          python -m venv "$RUNNER_TEMP/agora-studio-wheel"
          "$RUNNER_TEMP/agora-studio-wheel/bin/python" -m pip install core/dist/*.whl
          "$RUNNER_TEMP/agora-studio-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "./agora-studio-wheel/bin/agora-studio" --version
          "./agora-studio-wheel/bin/python" -c "from importlib.metadata import version; assert version('agora-studio') == '0.4.0'; assert version('agora-framework').startswith('0.7.')"
          "./agora-studio-wheel/bin/python" -c "from importlib.resources import files; root = files('agora_studio') / 'static'; assert (root / 'index.html').is_file(); assert (root / 'control-model.js').is_file(); assert (root / 'agora-mark.png').is_file()"

  wheel-integration:
    name: Core and Studio wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Studio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out minimum compatible Agora Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Modern-Ash/agora
          ref: v0.8.0
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build core
          python -m build

      - name: Install Core wheel before Studio wheel
        run: |
          python -m pip install core/dist/*.whl
          python -m pip install --no-deps dist/*.whl

      - name: Run non-mocked Core–Studio integration
        run: python -m unittest -v tests.test_real_integration

      - name: Verify installed package pair
        run: |
          cd "$RUNNER_TEMP"
          agora-studio --version
          python -c "from importlib.metadata import version; assert version('agora-framework') == '0.7.0'; assert version('agora-studio') == '0.4.0'"

  core-range:
    name: Core ${{ matrix.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: minimum
            requirement: agora-framework==0.7.0
          - core: latest-compatible
            requirement: agora-framework>=0.7,<0.8

    steps:
      - name: Check out Studio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install selected published Core wheel and Studio
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "${{ matrix.requirement }}"
          python -m pip install --no-deps -e ".[dev]"

      - name: Verify boundaries and full Core–Studio behavior
        run: |
          python scripts/check_boundaries.py
          python -m unittest discover -s tests -v

  chromium-e2e:
    name: Chromium E2E / installed wheels
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Studio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Core 0.8 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Modern-Ash/agora
          ref: v0.8.0
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build Studio and acquire compatible Core wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build core
          python -m build

      - name: Install real wheels and Playwright in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/agora-studio-e2e"
          "$RUNNER_TEMP/agora-studio-e2e/bin/python" -m pip install core/dist/*.whl
          "$RUNNER_TEMP/agora-studio-e2e/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/agora-studio-e2e/bin/python" -m pip install "playwright>=1.54,<2"
          "$RUNNER_TEMP/agora-studio-e2e/bin/python" -m playwright install --with-deps chromium

      - name: Run real Chromium control-plane scenarios
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/e2e
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agora-studio-e2e/bin/python" -c "from importlib.metadata import version; assert version('agora-framework').startswith('0.7.'); assert version('agora-studio') == '0.4.0'"
          "$RUNNER_TEMP/agora-studio-e2e/bin/python" "$GITHUB_WORKSPACE/e2e/test_chromium.py" -v

      - name: Upload screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-e2e-failure
          path: test-results/e2e
          if-no-files-found: ignore
