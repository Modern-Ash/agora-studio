name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-install:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out Studio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Studio, Core, and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Enforce Application Services boundary
        run: python scripts/check_boundaries.py

      - name: Test unit, frontend, HTTP, and real Core integration
        run: python -m unittest discover -s tests -v

      - name: Build Studio distributions
        run: python -m build

      - name: Install and smoke-test Studio wheel
        run: |
          python -m venv "$RUNNER_TEMP/agora-studio-wheel"
          "$RUNNER_TEMP/agora-studio-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "./agora-studio-wheel/bin/agora-studio" --version
          "./agora-studio-wheel/bin/python" -c "from importlib.metadata import version; assert version('agora-studio') == '0.2.0'; assert version('agora-framework').startswith('0.5.')"
          "./agora-studio-wheel/bin/python" -c "from importlib.resources import files; assert (files('agora_studio') / 'static' / 'index.html').is_file(); assert (files('agora_studio') / 'static' / 'agora-mark.png').is_file()"

  wheel-integration:
    name: Core and Studio wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Studio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Agora Core 0.5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Modern-Ash/agora
          ref: v0.5.0
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build core
          python -m build

      - name: Install Core wheel before Studio wheel
        run: |
          python -m pip install core/dist/*.whl
          python -m pip install --no-deps dist/*.whl

      - name: Run non-mocked Core–Studio integration
        run: python -m unittest -v tests.test_real_integration

      - name: Verify installed package pair
        run: |
          cd "$RUNNER_TEMP"
          agora-studio --version
          python -c "from importlib.metadata import version; assert version('agora-framework') == '0.5.0'; assert version('agora-studio') == '0.2.0'"
