name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build distributions
        run: python -m build

      - name: Install and smoke-test wheel
        run: |
          python -m venv "$RUNNER_TEMP/agora-studio-wheel"
          "$RUNNER_TEMP/agora-studio-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/agora-studio-wheel/bin/agora-studio" --version
          "$RUNNER_TEMP/agora-studio-wheel/bin/python" -c "from importlib.resources import files; assert (files('agora_studio') / 'static' / 'index.html').is_file(); assert (files('agora_studio') / 'static' / 'agora-mark.png').is_file()"
